<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniMe wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7e6d6; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  .bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; transition: opacity 2.5s ease; }
  #bgNight { opacity: 0; }
  #stage { position: fixed; left: 0; top: 0; transition: filter 2.5s ease; }
  #fg { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); pointer-events: none; user-select: none; transition: filter 2.5s ease; }
  body.night #stage, body.night #fg { filter: brightness(.84) saturate(.92); }
  #debug { position: fixed; left: 14px; top: 44px; font: 11px/1.45 ui-monospace, Menlo, monospace; color: #3b2a22;
           background: rgba(255,255,255,.85); padding: 8px 10px; border-radius: 12px; display: none; }
  #debug pre { margin: 0; font: inherit; }
  #toast { position: fixed; left: 50%; top: 9%; transform: translate(-50%, -10px); background: rgba(255,255,255,.92);
           color: #5b3426; padding: 10px 22px; border-radius: 999px; font-size: 22px; font-weight: 700; opacity: 0;
           box-shadow: 0 6px 24px rgba(120,60,40,.18); transition: opacity .35s, transform .35s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #count { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); font-size: 180px; font-weight: 900;
           color: #fff; -webkit-text-stroke: 6px #e9637b; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #count.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #rec { position: fixed; right: 24px; top: 44px; display: none; align-items: center; gap: 8px; background: rgba(255,255,255,.9);
         padding: 8px 16px; border-radius: 999px; color: #c0263e; font: 700 18px ui-rounded, system-ui; }
  #rec::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #e8344f; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
</style>
</head>
<body>
<img id="bg" class="bg" alt="" onerror="this.style.display='none'">
<img id="bgNight" class="bg" alt="" onerror="this.style.display='none'">
<canvas id="stage"></canvas>
<img id="fg" alt="" onerror="this.style.display='none'">
<div id="debug"><pre></pre></div>
<div id="toast"></div>
<div id="count"></div>
<div id="rec">REC</div>
<script src="assets/manifest.js"></script>
<script src="rig.js"></script>
<script type="module" src="tracker.js"></script>
</body>
</html>
