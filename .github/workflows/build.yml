name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check web code
        run: |
          node --check web/rig.js
          node --check web/mp-worker.js
          cp web/tracker.js "$RUNNER_TEMP/tracker.mjs" && node --check "$RUNNER_TEMP/tracker.mjs"

      - name: Build universal app
        run: ./build.sh --zip

      - uses: actions/upload-artifact@v4
        with:
          name: MiniMe
          path: build/MiniMe-*.zip
